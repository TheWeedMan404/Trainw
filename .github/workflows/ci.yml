# NX-26: CI for the Next.js app. The static app keeps its own check
# (npm run verify); this workflow adds the Next side the audit found
# missing: type-check, lint, smoke tests, and a production build.
#
# The next:build step runs with dummy Supabase values: the build only
# needs the env vars to exist, it never contacts Supabase (all dashboard
# routes are dynamic). Real credentials are never needed in CI.
name: CI

on:
  push:
  pull_request:

jobs:
  next-app:
    runs-on: ubuntu-latest
    steps:
      - name: Check out
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Type-check
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      - name: Smoke tests
        run: npm run test

      - name: Production build
        run: npm run next:build
        env:
          NEXT_PUBLIC_SUPABASE_URL: https://example.supabase.co
          NEXT_PUBLIC_SUPABASE_ANON_KEY: dummy-anon-key-for-ci-build

  static-app:
    runs-on: ubuntu-latest
    steps:
      - name: Check out
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "24"

      - name: Verify static app
        run: npm run verify
